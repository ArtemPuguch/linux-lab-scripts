
name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check script
        run: |
          test -f count_files.sh
          bash -n count_files.sh
          echo "Script test passed!"

  build-rpm:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora-version: [ "44", "45" ]

    container: fedora:${{ matrix.fedora-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DNF packages
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: fedora-${{ matrix.fedora-version }}-${{ hashFiles('packaging/rpm/count-files.spec') }}
          restore-keys: |
            fedora-${{ matrix.fedora-version }}-

      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Prepare sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES/count-files-1.0
          cp count_files.sh ~/rpmbuild/SOURCES/count-files-1.0/
          cd ~/rpmbuild/SOURCES
          tar czvf count-files-1.0.tar.gz count-files-1.0

      - name: Copy spec file
        run: cp packaging/rpm/count-files.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-fedora-${{ matrix.fedora-version }}
          path: /root/rpmbuild/RPMS/noarch/*.rpm

  build-deb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: [ "22.04", "24.04" ]

    container: ubuntu:${{ matrix.ubuntu-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ubuntu-${{ matrix.ubuntu-version }}-${{ hashFiles('packaging/deb/debian/control') }}
          restore-keys: |
            ubuntu-${{ matrix.ubuntu-version }}-

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential debhelper devscripts

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-1.0/debian
          cp count_files.sh build/count-files-1.0/
          cp count-files.conf build/count-files-1.0/
          cp -r packaging/deb/debian/* build/count-files-1.0/debian/

      - name: Build DEB
        run: |
          cd build/count-files-1.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-ubuntu-${{ matrix.ubuntu-version }}
          path: build/*.deb

  release:
    needs: [ build-rpm, build-deb ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
